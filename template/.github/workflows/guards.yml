# Consolidated fast guards — one job, one checkout, one setup-node, several `--check`/`node --test`
# steps. Formerly 2 separate workflows (build-order-guard, scripts-guard) in earlier projects spawned
# from this template; consolidated 2026-07-16 as part of a GitHub Actions minutes offload learned the
# hard way in the origin project (see its Roadmap/09-platform-infra/github-actions-local-first/). Each
# separate workflow ran in ~10-20 real seconds but still billed a GitHub Actions minimum of 1 minute
# per job — up to N billed minutes for one PR touching several areas. One job with several steps bills
# ~1 minute total instead.
#
# PR-only (no `push` trigger) — see this project's own AGENTS.md/WAYS-OF-WORKING.md for whether
# direct-to-main commits are your convention for low-risk doc/tooling work; if so, `.githooks/pre-commit`
# is the local-first equivalent of these same checks, run for free before the commit even lands.
#
# IMPORTANT — visibility vs Actions minutes: GitHub Actions minutes are only METERED for PRIVATE
# repos (a shared monthly pool across your whole account); PUBLIC repos get unlimited free minutes.
# If this project ends up public, none of this local-first work is a cost necessity here — it's still
# fine to keep for faster local feedback, but don't assume every future template-spawned repo needs
# the same urgency this consolidation was built to fix. Check `gh repo view --json isPrivate` if unsure.
name: guards

on:
  pull_request:
    paths:
      - 'Roadmap/**'
      - 'scripts/**'
      - '.claude/**'
      - 'jev.config.json'
      - 'apps/*/flags.mjs'
      - 'apps/*/flags.test.mjs'
      # TEMPLATE FILL-IN: add your own infra/**, .github/workflows/** etc. paths as those guards
      # get added (see build-order-guard.yml's original per-path shape in the origin project for
      # more examples: infra-guard, yaml-guard).

concurrency:
  group: guards-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-order's extractor derives dates from git history
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect changed areas
        id: areas
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "roadmap=$(echo "$changed" | grep -qE '^(Roadmap/|scripts/(build-order|roadmap-extract)\.mjs)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "scripts=$(echo "$changed" | grep -qE '^scripts/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "claude=$(echo "$changed" | grep -qE '^(\.claude/|scripts/permissions-smoke)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "flags=$(echo "$changed" | grep -qE '^apps/[^/]+/flags(\.test)?\.mjs' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # WAYS-OF-WORKING.md is GENERATED from WAYS-OF-WORKING.template.md + fill-ins.yml. A hand edit to
      # the generated file is how a fork of the process doc comes back.
      - name: WAYS-OF-WORKING — rendered file matches its source
        # Also on a scripts/ change: the renderer itself can change what the committed file should be.
        if: steps.areas.outputs.roadmap == 'true' || steps.areas.outputs.scripts == 'true'
        run: node scripts/render-ways-of-working.mjs --check

      - name: build-order — status board is fresh
        if: steps.areas.outputs.roadmap == 'true'
        run: node scripts/build-order.mjs --check

      - name: scripts/ — CLI/tooling node:test
        if: steps.areas.outputs.scripts == 'true'
        run: |
          shopt -s nullglob
          files=(scripts/lib/*.test.mjs scripts/*.test.mjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No scripts/**/*.test.mjs files yet — nothing to run."
            exit 0
          fi
          node --test "${files[@]}"

      # The flag seam's fail-soft contract. Zero deps, no credentials, no node_modules — which is the
      # point: a Golden Frijoles outage must never fail a build or a test run, and this proves it in
      # the most complete outage there is (the SDK not installed at all). See AGENTS.md rule 1.
      #
      # `scripts/preflight.mjs` is deliberately NOT run here: `.env.local` is gitignored, so a CI
      # checkout has no credential and the check would fail for a reason that is not a defect. It is
      # a session-start and post-`frijoles init` check. To run it here anyway, inject the same three
      # variables from CI secrets.
      - name: flags — the seam falls back rather than failing
        if: steps.areas.outputs.flags == 'true'
        run: |
          shopt -s nullglob
          files=(apps/*/flags.test.mjs)
          test "${#files[@]}" -gt 0 || { echo "no flag seam tests found" >&2; exit 1; }
          node --test "${files[@]}"

      # Jev semantic guards (jev-semantic-guards D8): replay the labelled fixtures' RECORDED Jev answers
      # through the real judges (offline — never calls the API), and fail when any rail has sat in `shadow`
      # past its `shadowExpires`. Unconditional on purpose: expiry is a date, not a diff.
      - name: jev — eval replay + shadow expiry
        run: node scripts/jev-eval.mjs

      # The committed permission rules: every deny/ask rule cited in .claude/permissions-ledger.json,
      # the allow list made of verb classes, no project-level auto mode. Static only — the behavioural
      # replay (`--live`) spends real Claude sessions, so it is run by hand when rules change; see the
      # script header for what it can and cannot prove.
      - name: permissions — contract holds
        if: steps.areas.outputs.claude == 'true'
        run: node scripts/permissions-smoke.mjs
